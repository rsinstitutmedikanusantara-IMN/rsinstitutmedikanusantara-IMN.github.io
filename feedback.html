<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Complaint | Institut Medika Nusantara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="feedback-page" style="min-height: 100vh; display: flex; align-items: center; padding: 40px 0; background: var(--off-white);">
        <div class="container">
            <div class="feedback-card-container" style="max-width: 650px; margin: 0 auto; background: var(--white); padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border);">
                <a href="index.html#information" class="back-link" style="display:inline-flex; align-items:center; gap:6px; font-size:0.8rem; font-weight:700; color:var(--blue-accent); margin-bottom:20px;">← Kembali ke Beranda</a>
                
                <div class="form-header" style="margin-bottom: 24px;">
                    <span style="font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; color: var(--blue-accent); text-transform: uppercase;">CUSTOMER CARE</span>
                    <h2 style="font-size: 1.8rem; margin-top: 4px;">Feedback & Complaint</h2>
                    <p style="color: var(--text-light); font-size: 0.9rem; margin-top: 6px;">Pengalaman dan masukan Anda sangat berharga untuk meningkatkan kualitas pelayanan Institut Medika Nusantara.</p>
                </div>

                <form id="feedbackForm">
                    <div class="form-group" style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:6px;">Nama Pasien / Pengunjung</label>
                        <input type="text" id="clientName" placeholder="Masukkan nama lengkap" style="width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--off-white);" required>
                    </div>

                    <div class="form-row" style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:16px;">
                        <div class="form-group">
                            <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:6px;">Jenis Pesan</label>
                            <select id="feedbackType" required style="width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--off-white);">
                                <option value="Pujian / Apresiasi">Pujian / Apresiasi</option>
                                <option value="Saran / Masukan">Saran / Masukan</option>
                                <option value="Keluhan / Complaint">Keluhan / Complaint</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:6px;">Kategori Layanan</label>
                            <select id="category" required style="width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--off-white);">
                                <option value="Pelayanan Pendaftaran / Adm">Pelayanan Pendaftaran / Adm</option>
                                <option value="Poli & Tenaga Medis">Poli & Tenaga Medis</option>
                                <option value="Fasilitas / Ruangan">Fasilitas / Ruangan</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:6px;">Uraian Pengalaman / Pesan</label>
                        <textarea id="messageDetail" rows="4" placeholder="Ceritakan pengalaman atau masukan Anda..." required style="width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--off-white);"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Kirim ke WhatsApp IMN & Wall of Appreciation →</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('clientName').value.trim();
            const type = document.getElementById('feedbackType').value;
            const category = document.getElementById('category').value;
            const detail = document.getElementById('messageDetail').value.trim();
            const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

            if (type === 'Pujian / Apresiasi') {
                const appreciations = JSON.parse(localStorage.getItem('imn_appreciation_data') || '[]');
                appreciations.unshift({ name, type, category, detail, date: dateStr });
                localStorage.setItem('imn_appreciation_data', JSON.stringify(appreciations));
            }

            const whatsappNumber = "6289673320727"; 
            const text = `💬 *FEEDBACK & COMPLAINT IMN*\n\n` +
                         `• *Nama*: ${name}\n` +
                         `• *Jenis*: ${type}\n` +
                         `• *Kategori*: ${category}\n` +
                         `• *Pesan/Uraian*:\n${detail}\n\n` +
                         `_Dikirim melalui Halaman Feedback Resmi Institut Medika Nusantara_`;

            window.location.href = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(text)}`;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel | IMN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: var(--off-white); padding: 30px 0;">
    <main class="container" style="max-width: 800px;">
        <a href="index.html" class="text-link" style="margin-bottom:20px; display:inline-block;">← Kembali ke Beranda</a>
        
        <div style="background: var(--navy-dark); color: var(--white); padding: 25px; border-radius: var(--radius-md); margin-bottom: 24px;">
            <span style="font-size:0.65rem; font-weight:700; color:var(--blue-accent); text-transform:uppercase;">ADMIN CONTROL PANEL</span>
            <h1 style="font-family:'Playfair Display',serif; font-size:1.6rem; margin-top:4px;">Kelola Berita & Data Dokter IMN</h1>
        </div>

        <div style="background: var(--white); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 24px;">
            <h3 style="font-family:'Playfair Display',serif; color:var(--navy-dark); font-size:1.1rem; margin-bottom:6px;">Ekspor Data untuk GitHub (Sinkron Perangkat)</h3>
            <p style="font-size:0.8rem; color:var(--text-light); margin-bottom:12px;">Download file `data.json` setelah menambah berita/dokter agar dapat di-upload ke GitHub.</p>
            <button type="button" id="exportBtn" class="btn btn-primary" style="font-size:0.8rem; padding:8px 14px;">📥 Download data.json Terbaru</button>
        </div>

        <div style="background: var(--white); padding: 25px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 24px;">
            <h3 style="font-family:'Playfair Display',serif; color:var(--navy-dark); font-size:1.2rem; margin-bottom:15px;">Tambah Berita Terbaru Website</h3>
            <form id="newsForm">
                <div class="form-group">
                    <label>Judul / Teks Singkat Berita</label>
                    <input type="text" id="newsTitle" placeholder="Contoh: IMN Membuka Pendaftaran Konsultasi Online Poli Jiwa" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Publikasikan Berita →</button>
            </form>
        </div>

        <div style="background: var(--white); padding: 25px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 24px;">
            <h3 style="font-family:'Playfair Display',serif; color:var(--navy-dark); font-size:1.2rem; margin-bottom:15px;">Tambah Dokter Baru</h3>
            <form id="doctorForm">
                <div class="form-group">
                    <label>Nama & Gelar Dokter</label>
                    <input type="text" id="docName" placeholder="Dr. dr. Anita Rahma, Sp.A" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Spesialisasi</label>
                        <input type="text" id="docSpec" placeholder="Poli Anak" required>
                    </div>
                    <div class="form-group">
                        <label>Jadwal Praktik</label>
                        <input type="text" id="docSched" placeholder="Senin - Jumat | 10.00 - 14.00 WIB" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Tambah Dokter →</button>
            </form>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const newsForm = document.getElementById('newsForm');
            const doctorForm = document.getElementById('doctorForm');
            const exportBtn = document.getElementById('exportBtn');

            newsForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const title = document.getElementById('newsTitle').value.trim();
                const newsList = JSON.parse(localStorage.getItem('imn_news_data') || '[]');
                newsList.unshift({ title, date: new Date().toLocaleDateString('id-ID') });
                localStorage.setItem('imn_news_data', JSON.stringify(newsList));
                newsForm.reset();
                alert('Berita berhasil ditambahkan ke website!');
            });

            doctorForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('docName').value.trim();
                const spec = document.getElementById('docSpec').value.trim();
                const sched = document.getElementById('docSched').value.trim();
                const doctors = JSON.parse(localStorage.getItem('imn_doctor_data') || '[]');
                doctors.push({ name, spec, sched });
                localStorage.setItem('imn_doctor_data', JSON.stringify(doctors));
                doctorForm.reset();
                alert('Dokter berhasil ditambahkan!');
            });

            exportBtn.addEventListener('click', () => {
                const doctors = JSON.parse(localStorage.getItem('imn_doctor_data') || '[]');
                const news = JSON.parse(localStorage.getItem('imn_news_data') || '[]');
                const exportData = { doctors, news };

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "data.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            });
        });
    </script>
</body>
</html>
